syntax = "proto3";

package helloworld;

option go_package = "github.com/noyblumenfeld/grpc-hello-app/gen/helloworld";

// The greeting service definition.
service Greeter {
  // Sends a greeting.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
